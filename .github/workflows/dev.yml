name: Deploy to dev

on:
  push:
    branches: main
  workflow_dispatch:

permissions: {}

jobs:
  call-workflow:
    uses: mbta/workflows/.github/workflows/deploy-ecs.yml@70e114f5f86aa991f1d4f96f24cf228883d1533c # v5.2.0
    with:
      app-name: watts
      environment: dev
    permissions:
      contents: read # Needed to check out the repository
      id-token: write # Needed to authenticate against AWS
    secrets:
      aws-role-arn: ${{ secrets.AWS_ROLE_ARN }}
      docker-repo: ${{ secrets.DOCKER_REPO }}
      slack-webhook: ${{ secrets.SLACK_WEBHOOK }}
